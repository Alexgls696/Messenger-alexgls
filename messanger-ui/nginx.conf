server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 🔹 React SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # 🔹 Проксирование /auth/
    location /auth/ {
        proxy_pass http://api-gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔹 Проксирование /api/
    location /api/ {
        proxy_pass http://api-gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔹 НОВОЕ: WebSocket проксирование для /ws-chat/
    location /ws-chat/ {
        proxy_pass http://api-gateway-service:8080;
        
        # === Ключевые настройки для WebSocket ===
        proxy_http_version 1.1;                          # WebSocket требует HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;          # Передаём заголовок Upgrade
        proxy_set_header Connection "upgrade";           # Явно указываем upgrade
        
        # === Стандартные заголовки ===
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # === Таймауты для долгоживущих соединений ===
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # === Буферизация ===
        proxy_buffering off;  
        proxy_cache off;
    }
}