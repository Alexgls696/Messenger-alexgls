server {
    listen 80;
    server_name _; # Можно заменить на alexgls-messenger.ru
    root /usr/share/nginx/html;
    index index.html;

    # 🔹 React SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # 🔹 Проксирование /auth/
    location /auth/ {
        proxy_pass http://api-gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ИСПРАВЛЕНО: Принудительно сообщаем бэкенду, что снаружи HTTPS
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Дополнительно: предотвращает редиректы бэкенда на http
        proxy_redirect http:// https://;
    }

    # 🔹 Проксирование /api/
    location /api/ {
        proxy_pass http://api-gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ИСПРАВЛЕНО: Сообщаем об HTTPS
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_redirect http:// https://;
    }

    # 🔹 WebSocket проксирование для /ws-chat/
    location /ws-chat/ {
        proxy_pass http://api-gateway-service:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ИСПРАВЛЕНО: Сообщаем об HTTPS (для WSS)
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_buffering off;  
        proxy_cache off;
    }
}