server:
  port: 8087

spring:
  application:
    name: message-storage-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/messaging_db}
    username: ${SPRING_DATASOURCE_USERNAME:alexgls}
    password: ${SPRING_DATASOURCE_PASSWORD:AS04SERa1}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8085}/.well-known/jwks.json

services:
  auth-service: ${AUTH_SERVICE_URL:http://localhost:8085}
  connections-service: ${CONNECTIONS_SERVICE:http://localhost:8086}

values:
  page-size: 10


app:
  security:
    aes-key: ${AES_KEY:0e3b03a3d8f1e8a9c3b0c1d2e3f4a5b6}
    hmac-key: ${HMAC_KEY:c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5}

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: ${spring.application.name}