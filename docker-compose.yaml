volumes:
  security_users_data:
  messaging_db_data:
  images_db_data:
  user-details-data:
  notifications-data:
  redis-data:
  es_data:
    driver: local

name: dev-alexgls-messenger

networks:
  users-network:
    driver: bridge

  elastic:
    driver: bridge

services:
  security-users-database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: security_users_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - security_users_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  messaging-database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: messaging_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - messaging_db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  notifications-database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notifications-data:/var/lib/postgresql/data
    ports:
      - "5441:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  files-database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: files_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - images_db_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      # Ограничиваем память Java, чтобы Docker не съел все ресурсы ПК
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # --- НАСТРОЙКИ БЕЗОПАСНОСТИ ---
      - xpack.security.enabled=true
      # Отключаем SSL (HTTPS) для HTTP API, чтобы в Java не возиться с сертификатами
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      # Задаем пароль для пользователя 'elastic'
      - ELASTIC_PASSWORD=elastic
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic

  connections-redis:
    image: redis:6.2.6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "AS04SERa1", "--notify-keyspace-events", "Ex" ]
    volumes:
      - redis-data:/data