spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8085}/.well-known/jwks.json


dlq:
  retry:
    # Максимальное количество попыток повторной обработки файла из DLQ.
    # После исчерпания лимита файл помечается как "permanent failure"
    # и удаляется из цикла retry.
    max-attempts: 5

    # Максимальный возраст сообщения в часах.
    # Если файл находится в DLQ дольше указанного времени,
    # он помечается как "permanent failure" и удаляется из цикла retry.
    max-age-hours: 24

    # Интервал между запусками scheduler для чтения DLQ (в миллисекундах).
    # По умолчанию 60 секунд.
    interval-ms: 60000


ai-services:
  countRequestsToAi: 1
  gigachat:
    auth-url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
    ai-url: https://gigachat.devices.sberbank.ru/api/v1
    load-files-url: https://gigachat.devices.sberbank.ru/api/v1/files
    auth-token: ${SBER_AUTH_TOKEN}