server:
  port: 8091

spring:
  application:
    name: notifications-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5441/notifications_db}
    username: ${SPRING_DATASOURCE_USERNAME:alexgls}
    password: ${SPRING_DATASOURCE_PASSWORD:AS04SERa1}

  kafka:
